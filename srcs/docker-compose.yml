services:
  nginx:
    build:
      dockerfile: ./requirements/nginx/Dockerfile
    image: nginx
    container_name: nginx
    env_file:
      - ./.env
    volumes:
      - wordpress:/var/www/html/wordpress
    ports:
      - "443:443"
    networks:
      - web
    depends_on:
      - wordpress
    restart: on-failure
  wordpress:
    build:
      dockerfile: ./requirements/wordpress/Dockerfile
    image: wordpress
    container_name: wordpress
    env_file:
      - ./.env
    volumes:
      - wordpress:/var/www/html/wordpress
    networks:
      - web
    expose:
      - "9000"
    depends_on:
      - mariadb
    restart: on-failure
  mariadb:
    build:
      dockerfile: ./requirements/mariadb/Dockerfile
    image: mariadb
    container_name: mariadb
    volumes:
      - mariadb:/var/lib/mysql
    networks:
      - web
    env_file:
      - ./.env
    expose:
      - "3306"
    restart: on-failure
networks:
  web:
volumes:
  wordpress:
    name: wordpress
    driver: local
    driver_opts:
      type: 'none'
      o: 'bind'
      device: '/home/${USER}/data/wordpress'
  mariadb:
    name: mariadb
    driver: local
    driver_opts:
      type: 'none'
      o: 'bind'
      device: '/home/${USER}/data/mariadb'
